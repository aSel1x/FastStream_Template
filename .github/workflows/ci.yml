name: CI

# Every action here is pinned to the lowest major that declares `runs.using: node24`.
# GitHub removes the Node 20 runtime from the runners on 2026-09-23, and the
# ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION escape hatch stops working at the same moment,
# so a node20 major is a dead job rather than a warning after that date.

on:
  push:
    branches: [main, ddd]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

      # The README's central architectural claim, checked rather than asserted.
      - name: Dependency rule (import-linter)
        run: uv run lint-imports

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - run: uv run basedpyright

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests with coverage
        run: uv run pytest tests --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Export locked dependencies
        run: uv export --frozen --no-dev --no-emit-project -o requirements.txt

      - name: Audit for known vulnerabilities
        run: uvx pip-audit --requirement requirements.txt --strict

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No other job parses docker-compose.yaml, so a malformed one reaches contributors
      # as a failing `make build` -- the very first command in the README. `cp .env.dist
      # .env` is what the README tells them to do first, and it is required rather than
      # cosmetic: --env-file only redirects interpolation, while every service's
      # `env_file: - .env` is still resolved literally and is an error when absent.
      - name: Validate the compose file
        run: cp .env.dist .env && docker compose config --quiet

      # The runner's default builder uses the `docker` driver, which cannot export a
      # build cache; `cache-to: type=gha` fails outright without a docker-container
      # builder to write it.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: false
          load: true
          tags: backend-template:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrations:
    name: Migrations match models
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backend_template
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backend_template
      POSTGRES_ECHO: 'false'
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Apply migrations
        run: uv run alembic -c alembic.ini upgrade head

      - name: Fail if the models have drifted from the migrations
        run: uv run alembic -c alembic.ini check
