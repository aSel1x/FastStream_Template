<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f6; color: #13191c;
           display: grid; place-items: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; border: 1px solid #d9e0e0; border-radius: 6px; padding: 2rem;
            max-width: 24rem; width: 100%; }
    h1 { font-size: 1.15rem; margin: 0 0 1rem; }
    label { display: block; font-size: .85rem; margin-bottom: .35rem; color: #43514f; }
    input { width: 100%; padding: .55rem .65rem; border: 1px solid #d9e0e0; border-radius: 4px;
            font: inherit; margin-bottom: 1rem; }
    button { width: 100%; padding: .6rem; border: 0; border-radius: 4px; background: #0b6b68;
             color: #fff; font: inherit; cursor: pointer; }
    .hint { font-size: .8rem; color: #6f7c7b; margin-top: .9rem; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Choose a new password</h1>
    <form method="post" action="/v1/auth/reset-password">
      <input type="hidden" name="token" value="{{ token }}">
      <label for="new_password">New password</label>
      <input id="new_password" name="new_password" type="password" required autocomplete="new-password">
      <button type="submit">Set password</button>
    </form>
    <p class="hint">At least 8 characters, with an upper- and lower-case letter, a digit and one
      symbol. Setting a new password signs you out everywhere.</p>
  </main>
</body>
</html>
