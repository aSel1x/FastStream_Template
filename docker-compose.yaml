version: '3.9'
name: faststream-template
services:
  api:
    build: .
    container_name: app.api
    image: app
    env_file:
      - .env
    command: ["uvicorn", "--factory", "presentation.api:get_litestar", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - "./src:/src"
    networks:
      - shared

  postgres_migration:
    image: app
    container_name: app.postgres_migration
    env_file:
      - .env
    build: .
    volumes:
      - ./alembic.ini:/src/alembic.ini:ro
    command: ["alembic", "upgrade", "head"]
    networks:
      - shared

networks:
  shared:
    external: True