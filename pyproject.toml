[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/application",
    "src/domain",
    "src/infrastructure",
    "src/presentation"
]

[project]
name = "backend-template"
version = "0.1.0"
description = "Best OIDC provider with RBAC in human history"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "faststream[cli,rabbit]>=0.6.7",
    "greenlet>=3.4.0",
    "litestar[opentelemetry]>=2.21.1",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
    "pyjwt>=2.12.1",
    "sqlalchemy>=2.0.49",
    "pyotp>=2.9.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
    "jinja2>=3.1.6",
    "aiosmtplib>=5.1.2",
    "dishka>=1.10.1",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.2",
    "ruff>=0.15.11",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "faker>=30.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.basedpyright]
ignore = ["**/migrations", "**/tests"]
typeCheckingMode = "all"
stubPath = "stubs"

[tool.ruff]
target-version = "py313"
line-length = 100
